<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noir Guides themes</title><style>
  :root {
    --bay: 20, 25, 34; --plate: #222A37; --edge: #4A5466; --paper: #F4F5F7; --dim: #B9BFCA; --faint: #8D95A3;
    --gold: #FFD100; --ok: #5BD675; --enemy: #FF6F6F; --friend: #74CCF4; --loot: #D9A6FF; --quest: #FFD100;
    --lamp: #3FC7EB; --alpha: 0.75; --s: 2;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Friz Quadrata TT", "Friz Quadrata", Georgia, serif; background: #0d1015; color: var(--paper);
    min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
  /* Stand-in game scene (synthetic): Tirisfal dusk, so the panel's translucency can be judged. */
  .scene { position: relative; overflow: hidden; min-height: 100vh;
    background:
      radial-gradient(60% 40% at 70% 18%, #f3c98a 0, rgba(243,201,138,0) 60%),
      linear-gradient(180deg, #6f86a8 0%, #b8a6a0 38%, #6d7a4f 52%, #3f4a2c 70%, #2a3220 100%); }
  .scene::after { content: "stand-in scene, not game art"; position: absolute; right: 12px; bottom: 10px; font: 11px system-ui; color: rgba(255,255,255,.55); }
  .win { position: absolute; left: 40px; top: 40px; width: calc(260px * var(--s)); transform-origin: top left;
    font-size: calc(11px * var(--s)); }
  .shadow { text-shadow: calc(1px * var(--s)) calc(-1px * var(--s) * -1) 0 rgba(0,0,0,.9); }
  .panel { position: relative; background: rgba(var(--bay), var(--alpha));
    outline: calc(1px * var(--s)) solid #000; border: calc(1px * var(--s)) solid var(--lamp); }
  .header { height: calc(36px * var(--s)); padding: calc(4px*var(--s)) calc(10px*var(--s)); position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 70%), var(--plate);
    border-bottom: calc(1px*var(--s)) solid #000; box-shadow: 0 calc(1px*var(--s)) 0 color-mix(in srgb, var(--lamp) 70%, transparent); }
  .title { font-size: calc(14px*var(--s)); color: var(--paper); line-height: 1.1; }
  .sub { position: absolute; left: calc(10px*var(--s)); bottom: calc(4px*var(--s)); font-size: calc(10px*var(--s)); color: var(--gold); }
  .range { position: absolute; right: calc(10px*var(--s)); bottom: calc(4px*var(--s)); font-size: calc(10px*var(--s)); color: var(--dim); }
  .menu { position: absolute; right: calc(5px*var(--s)); top: calc(5px*var(--s)); width: calc(14px*var(--s)); height: calc(12px*var(--s));
    background: linear-gradient(var(--dim),var(--dim)) 0 0/100% 18% no-repeat, linear-gradient(var(--dim),var(--dim)) 0 50%/100% 18% no-repeat, linear-gradient(var(--dim),var(--dim)) 0 100%/100% 18% no-repeat; }
  .cards { padding: calc(6px*var(--s)) calc(6px*var(--s)) calc(2px*var(--s)); display: grid; gap: calc(5px*var(--s)); }
  .card { position: relative; padding: calc(7px*var(--s)) calc(8px*var(--s)) calc(6px*var(--s));
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 40%), rgba(34,42,55,.94);
    border: calc(1px*var(--s)) solid var(--edge); box-shadow: 0 calc(2px*var(--s)) calc(4px*var(--s)) rgba(0,0,0,.45); }
  .card::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: calc(2px*var(--s)); background: var(--faint); }
  .card.current { border-color: color-mix(in srgb, var(--lamp) 55%, var(--edge)); }
  .card.current::before { background: var(--lamp); }
  .badge { font-size: calc(10px*var(--s)); color: var(--faint); letter-spacing: .04em; text-transform: uppercase; margin-bottom: calc(3px*var(--s)); }
  .current .badge { color: var(--lamp); }
  .goto { display: flex; justify-content: space-between; font-size: calc(12px*var(--s)); color: var(--paper); margin-bottom: calc(3px*var(--s)); }
  .goto b { font-weight: normal; color: var(--gold); }
  .own { color: var(--dim); margin-bottom: calc(4px*var(--s)); line-height: 1.3; }
  .line { display: grid; grid-template-columns: calc(12px*var(--s)) calc(12px*var(--s)) 1fr; gap: calc(4px*var(--s)); align-items: start; padding: calc(1px*var(--s)) 0; line-height: 1.25; }
  .tick { width: calc(12px*var(--s)); height: calc(12px*var(--s)); border: calc(1px*var(--s)) solid var(--faint); background: rgba(0,0,0,.35); }
  .tick.on { border-color: var(--lamp); background: var(--lamp) linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
    box-shadow: inset 0 0 0 calc(2px*var(--s)) rgba(20,25,34,.9); }
  .ico { width: calc(12px*var(--s)); height: calc(12px*var(--s)); border-radius: 2px; }
  .done, .done span { color: var(--dim); }
  .done .ico { opacity: .45; }
  .q { color: var(--quest); } .e { color: var(--enemy); } .f { color: var(--friend); } .l { color: var(--loot); }
  .list { padding: calc(4px*var(--s)) 0; }
  .row { display: grid; grid-template-columns: 1fr calc(28px*var(--s)); gap: calc(4px*var(--s)); padding: calc(3px*var(--s)) calc(10px*var(--s)); color: var(--paper); }
  .row .n { text-align: right; color: var(--faint); font-size: calc(10px*var(--s)); }
  .row.past { opacity: .5; }
  .row.cur { background: color-mix(in srgb, var(--lamp) 16%, transparent); box-shadow: inset calc(1px*var(--s)) 0 0 var(--lamp); }
  .row.hover { background: rgba(255,255,255,.06); }
  .footer { height: calc(26px*var(--s)); position: relative; padding: calc(4px*var(--s)) calc(10px*var(--s));
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.04)), rgba(34,42,55,.7); border-top: calc(1px*var(--s)) solid #000; font-size: calc(10px*var(--s)); color: var(--dim); }
  .footer .lv { position: absolute; left: 50%; transform: translateX(-50%); top: calc(4px*var(--s)); }
  .rail { position: absolute; left: calc(10px*var(--s)); right: calc(10px*var(--s)); bottom: calc(4px*var(--s)); height: calc(5px*var(--s));
    background: #0B0E13; outline: calc(1px*var(--s)) solid #000; }
  .rail i { position: absolute; inset: 0 auto 0 0; width: 46%;
    background: linear-gradient(180deg, rgba(255,255,255,.45) 0, rgba(255,255,255,.12) 45%, rgba(0,0,0,.18) 100%), var(--lamp); }
  aside { padding: 24px 20px; font: 14px/1.5 system-ui; color: #cfd5de; background: #12161d; border-left: 1px solid #000; }
  aside h1 { font-size: 16px; margin-bottom: 12px; color: #fff; }
  aside label { display: block; margin: 18px 0 6px; }
  aside input[type=range] { width: 100%; accent-color: var(--lamp); }
  aside .classes { display: flex; flex-wrap: wrap; gap: 6px; }
  aside button { font: 13px system-ui; padding: 5px 9px; border: 1px solid #000; background: #222a37; color: #fff; cursor: pointer; }
  aside button[aria-pressed=true] { outline: 1px solid var(--lamp); }
  aside p { margin-top: 18px; font-size: 13px; color: #9aa3b0; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } .win { --s: 1.3; left: 16px; top: 16px; } aside { border-left: 0; border-top: 1px solid #000; } }

  body { display:block; }
  .scene { min-height:100vh; padding: 72px 24px 40px; }
  .bar { position: fixed; z-index: 2; inset: 0 0 auto 0; display:flex; gap:24px; align-items:center; padding: 12px 24px; background:#12161d; border-bottom:1px solid #000; font:14px system-ui; color:#cfd5de; }
  .bar strong { color:#fff; font-size:15px; }
  .bar input { width: 220px; accent-color:#FFD100; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(calc(260px * var(--s)), 1fr)); gap: 28px 24px; }
  .tile { margin:0; }
  .tile figcaption { font: 600 14px system-ui; color:#fff; margin-bottom:8px; text-shadow:0 1px 2px #000; }
  .tile figcaption small { font-weight:400; color:#d6dbe3; }
  .tile .win { position: static; }
  .black { --bay: 0, 0, 0; --plate: #14171C; --edge: #3A3F48; --faint: #8E949E; }
  .black .card { background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 40%), rgba(20,23,28,.95); }
  .black .footer { background: rgba(20,23,28,.8); }
  :root { --s: 1.15; }
  @media (max-width: 640px) { :root { --s: 1.1; } .bar { flex-wrap: wrap; gap: 8px 16px; } .scene { padding-top: 110px; } }
</style></head>
